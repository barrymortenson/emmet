name: ci

# A PR's own pushes only: the merge to main was already tested as the PR's merge commit, so main doesn't run it again.
# Everything a PR can run runs weekly, by hand, and on a PR labeled full-ci (from its next push); otherwise
# scripts/ci-scope.sh picks what the change can break (plan section 16). The bench and the extra E2E tier are by hand.
# The weekly run is also what fills main's Rust caches, which a new PR's first run starts from.
on:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      windows:
        description: "Run the Windows jobs too (paused while the Mac app comes first, D-43)"
        type: boolean
        default: false

permissions:
  contents: read

# Line tables only, not full debug info: a panic's backtrace keeps its files and lines, and the debug builds link
# faster and cache smaller.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What to run. A push to a PR whose last push passed ci is scoped to its own commits; otherwise to the whole PR.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      base: ${{ steps.scope.outputs.base }}
      full: ${{ steps.scope.outputs.full }}
      mac: ${{ steps.scope.outputs.mac }}
      e2e_mac: ${{ steps.scope.outputs.e2e_mac }}
      windows: ${{ steps.scope.outputs.windows }}
      e2e_windows: ${{ steps.scope.outputs.e2e_windows }}
      nsis: ${{ steps.scope.outputs.nsis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          EMMET_CI_WINDOWS: ${{ inputs.windows && '1' || '' }}
        run: |
          full=0; base=""
          if [[ "$EVENT" != pull_request || " $LABELS " == *" full-ci "* ]]; then
            full=1
          else
            base=$PR_BASE
            if [[ "$ACTION" == synchronize ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs?check_name=ci" --jq '[.check_runs[].conclusion] | first')" == success ]]; then
              base=$BEFORE
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          EMMET_CI_FULL=$full EMMET_CI_BASE=$base scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"
          echo "ci scope: base ${base:-none (full)}; $(EMMET_CI_FULL=$full EMMET_CI_BASE=$base scripts/ci-scope.sh | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  # GitHub's hosted Macs run the PR's Mac jobs (Barry, 2026-11-06): free for this public repo, and nothing done on
  # Barry's Mac (a locked screen, another Space, the lid shut, a local E2E run) can fail them. macos-15, not
  # macos-latest, so the image (its screen, fonts, and WebKit) changes only when we move it, with the baselines. The
  # checks and tests run here, the E2E in mac-e2e beside it; each builds once (just ci checks, just ci e2e).
  mac:
    runs-on: macos-15
    # A full run from a cold cache: about 25 minutes (2026-11-05).
    timeout-minutes: 45
    needs: scope
    if: needs.scope.outputs.mac == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      # The integration tests' data dir and home live in the runner's temp dir, not target/, which rust-cache saves:
      # a restored half of an earlier run's Python install broke uv.
      - name: Test data dirs
        run: printf 'EMMET_DATA_DIR=%s\nEMMET_TEST_HOME=%s\n' "$RUNNER_TEMP/emmet-data" "$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.22
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0,cargo-deny@0.20.2
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  /tmp/gitleaks.tgz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # A failed run saves its cache too: otherwise one failure leaves the next run cold.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: just setup
      # just ci runs scripts/ci-scope.sh again with the same inputs, so it picks the same scope.
      - run: just ci checks
        env:
          EMMET_CI_BASE: ${{ needs.scope.outputs.base }}
          EMMET_CI_FULL: ${{ needs.scope.outputs.full == 'true' && '1' || '' }}
      - name: Timing
        if: always()
        run: |
          s=$(( $(date +%s) - CI_START ))
          echo "mac job: $(( s / 60 ))m $(( s % 60 ))s" >> "$GITHUB_STEP_SUMMARY"

  # The app E2E on a hosted Mac, beside the mac job: the E2E build (the webdriver feature) and the specs
  # tests/e2e/tiers.mjs picks.
  mac-e2e:
    runs-on: macos-15
    timeout-minutes: 45
    needs: scope
    if: needs.scope.outputs.e2e_mac == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      # The integration tests' data dir and home live in the runner's temp dir, not target/, which rust-cache saves:
      # a restored half of an earlier run's Python install broke uv.
      - name: Test data dirs
        run: printf 'EMMET_DATA_DIR=%s\nEMMET_TEST_HOME=%s\n' "$RUNNER_TEMP/emmet-data" "$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.22
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # The viewer turns the build animation off under the system's Reduce motion (plan section 13), and the build
      # animation specs need it on. hello.e2e.mjs fails at once if it's still on.
      - name: Motion on
        run: |
          echo "reduce motion was: $(defaults read com.apple.universalaccess reduceMotion 2>&1 || true)"
          defaults write com.apple.universalaccess reduceMotion -bool false || true
      - run: just deps
      # TEMPORARY (reverted in the next commit): every spec, with every window baseline rewritten for the artifact.
      - run: just e2e all
        env:
          EMMET_UPDATE_BASELINES: "1"
          EMMET_CI_BASE: ${{ needs.scope.outputs.base }}
          EMMET_CI_FULL: ${{ needs.scope.outputs.full == 'true' && '1' || '' }}
      # Screenshots, renders, visual diffs, and the baselines a changed screen would need (tests/e2e/out/baselines).
      - name: E2E output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos
          path: |
            tests/e2e/out/
            !tests/e2e/out/projects/
          if-no-files-found: ignore
      - name: Timing
        if: always()
        run: |
          s=$(( $(date +%s) - CI_START ))
          echo "mac-e2e job: $(( s / 60 ))m $(( s % 60 ))s" >> "$GITHUB_STEP_SUMMARY"

  # Windows runs as two jobs side by side, as the Mac does: the tests here, the E2E in windows-e2e. One job ran them in
  # turn, and its E2E build recompiled most of the workspace for the webdriver feature (75 minutes, 2026-11-06).
  windows:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    # just test from a cold cache took 21 to 29 minutes (2026-11-02, 2026-11-06).
    timeout-minutes: 45
    defaults:
      run:
        # Git Bash, so just finds bash (see justfile).
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # just test --changed diffs against the scope's base.
          fetch-depth: 0
      - run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      # Defender scans every file cargo and pnpm write, which slows a cold build badly. This VM is thrown away after
      # the job.
      - name: Defender off
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # As on the Mac: test data outside target/, which rust-cache saves.
      - name: Test data dirs
        run: printf 'EMMET_DATA_DIR=%s\nEMMET_TEST_HOME=%s\n' "$RUNNER_TEMP/emmet-data" "$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.22
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      # A failed or timed-out run saves its cache too: otherwise one failure leaves the next run cold.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: rustup toolchain install
      - run: just deps
      - run: just test ${{ needs.scope.outputs.full != 'true' && '--changed' || '' }}
        env:
          EMMET_CI_BASE: ${{ needs.scope.outputs.base }}
      # The app for the Windows VM check (H-04): the plain debug build `just test` made (windows-e2e's build adds the
      # WebDriver server), its emmet sidecar, uv for Python, and ldraw-mini to install. Kept 7 days.
      - name: Windows app for the VM
        if: needs.scope.outputs.e2e_windows == 'true'
        run: |
          mkdir -p vm
          cp target/debug/emmet-desktop.exe target/debug/emmet.exe "$(command -v uv)" vm/
          data=$(cygpath -u "$(target/debug/prepare-data.exe)")
          cp "$data/ldraw-mini.zip" vm/
          (cd vm && sha256sum ldraw-mini.zip | cut -d' ' -f1 > ldraw-mini.sha256)
      - if: needs.scope.outputs.e2e_windows == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emmet-windows-vm
          path: vm/
          retention-days: 7
      - name: Timing
        if: always()
        run: |
          s=$(( $(date +%s) - CI_START ))
          echo "windows job: $(( s / 60 ))m $(( s % 60 ))s" >> "$GITHUB_STEP_SUMMARY"

  # Windows E2E: the specs for paths and processes (tests/e2e/tiers.mjs windows), only when the native side or the
  # specs change, or with everything else.
  windows-e2e:
    needs: scope
    if: needs.scope.outputs.e2e_windows == 'true'
    runs-on: windows-latest
    # The E2E build from a cold cache (about 15 minutes) and the specs, which draw in software here: the instructions
    # spec's two books took 171 and 88 s to export on 2026-11-06, so the job gets 75 minutes (Barry, 2026-11-05; by hand
    # only while D-43 pauses it).
    timeout-minutes: 75
    defaults:
      run:
        # Git Bash, so just finds bash (see justfile).
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # just test --changed diffs against the scope's base.
          fetch-depth: 0
      - run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      # Defender scans every file cargo and pnpm write, which slows a cold build badly. This VM is thrown away after
      # the job.
      - name: Defender off
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # As on the Mac: test data outside target/, which rust-cache saves.
      - name: Test data dirs
        run: printf 'EMMET_DATA_DIR=%s\nEMMET_TEST_HOME=%s\n' "$RUNNER_TEMP/emmet-data" "$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.22
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      # A failed or timed-out run saves its cache too: otherwise one failure leaves the next run cold.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: rustup toolchain install
      - run: just deps
      - run: just e2e windows
      - name: E2E output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-windows
          path: |
            tests/e2e/out/
            !tests/e2e/out/projects/
          if-no-files-found: ignore
      - name: Timing
        if: always()
        run: |
          s=$(( $(date +%s) - CI_START ))
          echo "windows-e2e job: $(( s / 60 ))m $(( s % 60 ))s" >> "$GITHUB_STEP_SUMMARY"

  # The unsigned NSIS installer (1D; plan section 17), from `just release-dry`: when the release files change, weekly,
  # and by hand. A release build takes longer than the windows job's budget, so it's its own job.
  nsis:
    needs: scope
    if: needs.scope.outputs.nsis == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.22
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - run: rustup toolchain install
      - run: just deps
      # A test installer bundles the small pack built from the Rebrickable fixture, with no network; a release bundles
      # the full one (plan section 12).
      - run: >-
          cargo build --release --locked -p emmet-cli &&
          target/release/emmet parts-data build tests/fixtures/rebrickable-mini --out target/parts-data-mini
      - run: just release-dry
        env:
          EMMET_PARTS_DATA_PACK: target/parts-data-mini
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emmet-windows-nsis
          path: target/release/bundle/nsis/*.exe
          retention-days: 14

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/plan-check.mjs
      - run: node scripts/spdx-check.mjs
      # The LDraw parts in the test fixture keep their license, authors, and bytes (ADR 0003).
      - run: node scripts/ldraw-mini-check.mjs
      # The design mockups' contrast gate (2A): a push that changes only docs/design skips the Mac job, so it runs here.
      - run: node scripts/contrast-check.mjs
      # A PR checks its own commits; a manual or weekly run checks the branch against main.
      - name: DCO
        if: github.event_name != 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: scripts/dco-check.sh "$BASE" "$HEAD"
      - run: node --test tests/scripts/plan-check.test.mjs tests/scripts/spdx-dco.test.mjs tests/scripts/ci.test.mjs tests/scripts/e2e-tiers.test.mjs tests/scripts/ldraw-mini-check.test.mjs tests/scripts/scrub-transcript.test.mjs tests/scripts/terms-check.test.mjs tests/scripts/contrast-check.test.mjs

  # The one required check: green only when scope and plan passed and each OS job (and nsis) passed or was scoped out.
  ci:
    if: always()
    needs: [scope, mac, mac-e2e, windows, windows-e2e, plan, nsis]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.scope.result }} ${{ needs.mac.result }} ${{ needs.mac-e2e.result }} ${{ needs.windows.result }} ${{ needs.windows-e2e.result }} ${{ needs.plan.result }} ${{ needs.nsis.result }}
        run: |
          echo "scope mac mac-e2e windows windows-e2e plan nsis: $RESULTS"
          [[ "$RESULTS" =~ ^success\ (success|skipped)\ (success|skipped)\ (success|skipped)\ (success|skipped)\ success\ (success|skipped)$ ]]
