# Train track's interlocking ends (plan section 11; rung 2 depends on them). The LDCad Shadow Library has no entry
# for any of these parts. Every end sleeper has a knob on one side of its end face and a socket on the other, 20 LDU
# out from the track's center line, on the end face's line (local x = 0), at the top of the sleeper. A track turned
# end for end puts its knob where the next track's socket is, so each joint is a knob in a socket and a socket on a
# knob. Measured from the subparts' geometry in the 2026-09 library:
#
# - Plastic track, straight 53401 and curve 53400: s/53401s02 and s/53400s02 (the same end): the knob is a 3/4
#   cylinder of radius 5 at (0, 0, 20), the socket an inverted 5/8 cylinder of radius 5 at (0, 0, -20).
# - 9V track, and the 9V switches' three ends: s/2867as05, which the end sleepers include: the clip (the socket) at
#   (0, 0, 20), the pin (the knob) at (0, 0, -20), drawn the other way round, so a 9V end and a plastic end join.
#
# Each override names a model in tests/fixtures/validator/connections/ that validates only with it.

[[override]]
part = "s/53401s02"
reason = "No shadow entry: the plastic straight track's interlocking end (knob and socket)."
test = "track.ldr"
snaps = [
  "!LDCAD SNAP_GEN [group=trackend] [gender=M] [pos=0 0 20]",
  "!LDCAD SNAP_GEN [group=trackend] [gender=F] [pos=0 0 -20]",
]

[[override]]
part = "s/53400s02"
reason = "No shadow entry: the plastic curved track's interlocking end, the same as the straight's."
test = "track.ldr"
snaps = [
  "!LDCAD SNAP_GEN [group=trackend] [gender=M] [pos=0 0 20]",
  "!LDCAD SNAP_GEN [group=trackend] [gender=F] [pos=0 0 -20]",
]

[[override]]
part = "s/2867as05"
reason = "No shadow entry: the 9V end sleeper's clip and pin, which every 9V switch end includes."
test = "track.ldr"
snaps = [
  "!LDCAD SNAP_GEN [group=trackend] [gender=F] [pos=0 0 20]",
  "!LDCAD SNAP_GEN [group=trackend] [gender=M] [pos=0 0 -20]",
]
