[package]
name = "emmet-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "emmet_desktop"
path = "src/lib.rs"

[[bin]]
name = "emmet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
emmet-core.workspace = true
emmet-agent = { workspace = true, features = ["specta"] }
emmet-bus.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-specta.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }

[dev-dependencies]
emmet-it = { path = "../../../tests/it" }

[features]
# The frontend embedded in the binary: every build but `just dev`, which serves it from Vite. Without it a plain
# `cargo build` would load the dev server's URL, and render mode (emmet render) would show a blank page.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# The embedded WebDriver server for E2E tests (ADR 0002). Only `just e2e` turns it on, and only in debug builds.
webdriver = ["dep:tauri-plugin-wdio-webdriver", "dep:objc2"]

[lints]
workspace = true
