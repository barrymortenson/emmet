packages:
  - apps/*
  - packages/*
  - tests/e2e
  - tests/spikes/headless-render

# Install scripts that don't run: the E2E suite uses the embedded WebDriver server, so no browser driver downloads
# (ADR 0002), and esbuild's binary comes from its platform package without its check script.
allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false

catalog:
  "@wdio/cli": 9.32.0
  "@wdio/globals": 9.31.3
  "@wdio/local-runner": 9.32.0
  "@wdio/mocha-framework": 9.32.0
  "@wdio/spec-reporter": 9.32.0
  "@wdio/tauri-service": 1.5.1
  "@eslint/js": 10.0.1
  "@tauri-apps/api": 2.12.4
  "@tauri-apps/cli": 2.12.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/three": 0.186.0
  "@vitejs/plugin-react": 6.1.2
  eslint: 10.13.0
  globals: 17.13.0
  pixelmatch: 8.0.0
  react: 19.3.1
  three: 0.186.1
  react-dom: 19.3.1
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vite: 8.3.5

minimumReleaseAgeExclude:
  - '@wdio/native-core@1.3.1'
  - '@wdio/native-spy@1.4.1'
  - '@wdio/native-types@2.6.1'
  - '@wdio/native-utils@2.8.1'
  - '@wdio/tauri-service@1.5.1'
