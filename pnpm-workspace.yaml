packages:
  - apps/*
  - packages/*
  - tests/e2e
  - tests/spikes/headless-render

# Install scripts that don't run: the E2E suite uses the embedded WebDriver server, so no browser driver downloads
# (ADR 0002), and esbuild's binary comes from its platform package without its check script.
allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false

# Security fixes in the WebdriverIO dev tree (Dependabot), past the ranges its packages ask for: mocha 10 takes
# serialize-javascript 6 and get-uri takes basic-ftp 5. Drop these once WebdriverIO moves up.
overrides:
  basic-ftp@<6.2.1: 6.2.3
  serialize-javascript@<7.1.3: 7.1.4

catalog:
  "@wdio/cli": 9.33.1
  "@wdio/globals": 9.33.1
  "@wdio/local-runner": 9.33.1
  "@wdio/mocha-framework": 9.33.1
  "@wdio/spec-reporter": 9.33.1
  "@wdio/tauri-service": 1.5.1
  "@eslint/js": 10.0.1
  "@tauri-apps/api": 2.12.4
  "@tauri-apps/cli": 2.12.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/three": 0.187.0
  "@vitejs/plugin-react": 6.3.0
  eslint: 10.14.0
  globals: 17.14.0
  lucide-react: 1.71.0
  pixelmatch: 8.0.0
  radix-ui: 1.8.1
  react: 19.3.1
  three: 0.187.0
  react-dom: 19.3.1
  typescript: 6.0.3
  typescript-eslint: 8.72.2
  vite: 8.3.8

minimumReleaseAgeExclude:
  - '@wdio/native-core@1.3.1'
  - '@wdio/native-spy@1.4.1'
  - '@wdio/native-types@2.6.1'
  - '@wdio/native-utils@2.8.1'
  - '@wdio/tauri-service@1.5.1'
