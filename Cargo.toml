[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "tests/it", "tests/spikes/binaries", "tests/spikes/headless-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/barrymortenson/emmet"
publish = false

[workspace.dependencies]
emmet-core = { path = "crates/emmet-core" }
emmet-agent = { path = "crates/emmet-agent" }
emmet-bus = { path = "crates/emmet-bus" }
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.34.1"
insta = { version = "1.49.0", features = ["json", "redactions"] }
rmcp = { version = "3.7.0", features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "process"] }
toml = "1.1.8"
# The library download (ADR 0007): rustls with the OS trust store.
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
# E2E only: the embedded WebDriver server, behind emmet-desktop's `webdriver` feature (ADR 0002).
tauri-plugin-wdio-webdriver = "1.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
