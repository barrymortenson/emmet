[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "tests/it", "tests/fake-agents"]
# The 0B spikes answered their questions (ADRs 0005, 0006) and are kept for reference only, out of the build and CI.
exclude = ["tests/spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/barrymortenson/emmet"
publish = false

[workspace.dependencies]
emmet-core = { path = "crates/emmet-core" }
emmet-agent = { path = "crates/emmet-agent" }
emmet-bus = { path = "crates/emmet-bus" }
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.34.1"
# The OS keychain for the Codex API key (D-35; ADR 0009, approved 2026-10-25): only the macOS and Windows stores.
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
interprocess = "2.4.6"
insta = { version = "1.49.0", features = ["json", "redactions"] }
# The project watcher (plan section 07).
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
rmcp = { version = "3.7.0", features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "io-std", "process"] }
toml = "1.1.8"
# The library download (ADR 0007): rustls with the OS trust store.
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
# Windows only: the bus pipe's SDDL access list (emmet-bus; ADR 0009). Already in the tree through interprocess.
widestring = "1.2.1"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-dialog = "2.8.3"
# Typed commands and events with generated TS bindings (plan section 06).
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
# E2E only: the embedded WebDriver server, behind emmet-desktop's `webdriver` feature (ADR 0002).
tauri-plugin-wdio-webdriver = "1.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
