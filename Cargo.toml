[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "tests/it"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/barrymortenson/emmet"
publish = false

[workspace.dependencies]
emmet-core = { path = "crates/emmet-core" }
emmet-agent = { path = "crates/emmet-agent" }
emmet-bus = { path = "crates/emmet-bus" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
